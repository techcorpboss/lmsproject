# ==============================================================================
# Nginx Configuration for lms.techcorp.info.vn
# File path on Ubuntu: /etc/nginx/sites-available/lms.techcorp.info.vn
# ==============================================================================

server {
    listen 80;
    server_name lms.techcorp.info.vn;

    # Thư mục chứa Frontend React đã build
    root /www/wwwroot/lms.techcorp.info.vn/frontend/build;
    index index.html index.htm;

    # Dung lượng upload tối đa (video bài giảng, PDF, tài liệu kiểm tra)
    client_max_body_size 200M;

    # Bật nén Gzip tối ưu tốc độ tải bài giảng
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript image/svg+xml;

    # 1. Định tuyến giao diện SPA (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Reverse Proxy cho toàn bộ REST API kết nối Backend NodeJS (PM2 Port 5009)
    location /api/ {
        proxy_pass http://127.0.0.1:5009/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout dài cho tác vụ sinh đề thi ma trận và nộp bài số lượng lớn
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 3. Hỗ trợ Socket.io WebSocket cho Phòng thi trực tuyến & Giám sát AI (Live Proctoring)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5009/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 4. Cache cho tệp tĩnh Frontend (CSS, JS, Fonts, Images)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Log files
    access_log /var/log/nginx/lms.techcorp.info.vn_access.log;
    error_log /var/log/nginx/lms.techcorp.info.vn_error.log;
}
